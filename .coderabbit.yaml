# CodeRabbit Configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit

language: "ko-KR"

tone_instructions: |
  시니어 프론트엔드 개발자 관점에서 리뷰해주세요.
  문제점을 지적할 때는 이유와 함께 구체적인 개선 방법을 제시해주세요.
  칭찬할 만한 코드 패턴이 있다면 언급해주세요.

reviews:
  profile: "assertive"
  request_changes_workflow: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"

  poem: false
  collapse_walkthrough: false
  sequence_diagrams: true

  path_instructions:
    # FSD 아키텍처 레이어별 리뷰 지침
    - path: "src/app/**"
      instructions: |
        app 레이어입니다. 다음을 확인해주세요:
        - 전역 Provider 설정이 올바른지 (React Query, Router 등)
        - 전역 스타일 및 폰트 설정
        - main.tsx의 StrictMode 사용 여부
        - 라우팅 구조가 lazy loading을 활용하는지 확인

    - path: "src/pages/**"
      instructions: |
        pages 레이어입니다. 다음을 확인해주세요:
        - 페이지 컴포넌트가 비즈니스 로직 없이 조합(Composition)만 하는지
        - React.lazy / Suspense를 통한 코드 스플리팅 적용 여부
        - 페이지 단위 SEO 메타데이터 처리
        - 하위 레이어(widgets, features, entities, shared)만 import하는지 (상위 레이어 import 금지)

    - path: "src/features/**"
      instructions: |
        features 레이어입니다. 다음을 확인해주세요:
        - 단일 책임 원칙: 하나의 feature는 하나의 기능만 담당하는지
        - entities, shared 레이어만 import하는지
        - Public API(index.ts)를 통해서만 외부에 노출하는지
        - 비즈니스 로직이 UI 컴포넌트와 분리되어 있는지

    - path: "src/entities/**"
      instructions: |
        entities 레이어입니다. 다음을 확인해주세요:
        - 도메인 모델(타입/인터페이스) 정의가 명확한지
        - shared 레이어만 import하는지
        - 비즈니스 규칙과 무관한 순수 도메인 로직인지

    - path: "src/shared/**"
      instructions: |
        shared 레이어입니다. 다음을 확인해주세요:
        - 다른 레이어를 import하지 않는지 (완전한 독립성)
        - UI 컴포넌트의 재사용성과 범용성
        - API 설정, 유틸 함수의 순수성(side-effect 없음)
        - 환경변수(import.meta.env) 직접 접근 대신 추상화 레이어 사용 여부

    # 컴포넌트 파일
    - path: "**/*.tsx"
      instructions: |
        React 컴포넌트를 리뷰합니다. 다음을 확인해주세요:

        [성능]
        - 불필요한 리렌더링: useMemo, useCallback 적절한 사용
        - 무거운 컴포넌트의 React.memo 적용 여부
        - 리스트 렌더링 시 key prop이 index가 아닌 고유값인지
        - 인라인 함수/객체가 JSX 내에서 직접 생성되어 리렌더링을 유발하는지

        [접근성 (a11y)]
        - 인터랙티브 요소(<div onClick> 등)에 role, aria-label 속성 부재
        - img 태그의 alt 속성 누락
        - form 요소와 label의 연결 (htmlFor / id)
        - 키보드 접근성 (tabIndex, onKeyDown)

        [Tailwind CSS]
        - 인라인 style 속성 대신 Tailwind 클래스 사용 권장
        - 반복되는 클래스 조합은 컴포넌트나 cn() 유틸로 추상화 권장
        - 모바일 우선(mobile-first) 반응형 클래스 사용 여부

        [컴포넌트 설계]
        - Props 타입 정의 누락 또는 any 사용
        - 컴포넌트가 너무 많은 책임을 지는지 (단일 책임 원칙)
        - children prop 활용 여부 (합성 패턴)

    # 커스텀 훅
    - path: "**/*.ts"
      instructions: |
        TypeScript 파일을 리뷰합니다. 다음을 확인해주세요:

        [타입 안전성]
        - any, unknown 타입의 남용
        - 타입 단언(as Type, !) 대신 타입 가드 사용 권장
        - 함수의 반환 타입 명시 여부
        - 제네릭을 활용한 재사용 가능한 타입 설계

        [커스텀 훅 (use* 파일)]
        - 훅이 단일 책임을 가지는지
        - 의존성 배열(deps)이 정확한지 (react-hooks/exhaustive-deps)
        - 클린업 함수 누락 (useEffect, 이벤트 리스너, 타이머)
        - 훅의 반환값이 명확히 타입화되어 있는지

        [보안]
        - 민감 정보(토큰, 키)가 console.log에 노출되는지
        - localStorage/sessionStorage에 민감 데이터 평문 저장 여부
        - XSS 취약점 (dangerouslySetInnerHTML 사용 등)

    # API 레이어
    - path: "src/shared/api/**"
      instructions: |
        API 레이어를 리뷰합니다. 다음을 확인해주세요:
        - 에러 처리: try/catch 누락 또는 에러를 그냥 삼키는 경우
        - axios interceptor를 통한 공통 에러 처리 여부
        - API 응답 타입이 명확히 정의되어 있는지
        - 토큰 갱신(refresh) 로직의 race condition 처리
        - API 함수가 부수효과(store 업데이트 등) 없이 순수하게 유지되는지
        - 민감한 데이터가 URL 파라미터로 노출되지 않는지

    # Zustand 스토어
    - path: "src/shared/stores/**"
      instructions: |
        Zustand 스토어를 리뷰합니다. 다음을 확인해주세요:
        - 스토어가 전역 상태가 필요한 데이터만 관리하는지 (로컬 상태는 useState 사용)
        - selector를 활용한 불필요한 리렌더링 방지
        - 민감 정보(accessToken 등)가 스토어에서 어떻게 관리되는지
        - persist 미들웨어 사용 시 민감 데이터 제외 여부 (partialize)
        - 스토어 액션이 명확하게 네이밍되었는지

  finishing_touches:
    docstrings:
      enabled: false

chat:
  auto_reply: true
